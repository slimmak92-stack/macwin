name: Build ABRA (Windows 10 compatible)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package (installer + portable zip)
        shell: pwsh
        run: |
          $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          powershell -File installer\build-installer.ps1 -Version 0.6.0 -NoBuild

      - uses: actions/upload-artifact@v4
        with:
          name: ABRA-win10-compatible
          path: |
            dist/ABRA-Setup-0.6.0.exe
            dist/ABRA-0.6.0-win-x64.zip
